[package]
name = "zafi-bench-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned source checkout restored by tools/fetch-reference.sh.
taffy = { path = "../../../.references/taffy" }

# Match the Zig `-Doptimize=ReleaseFast` comparison at Taffy's best: full LTO
# and a single codegen unit.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

